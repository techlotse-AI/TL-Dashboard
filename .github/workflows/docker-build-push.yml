# ─────────────────────────────────────────────────────────────────────────────
# CI — Lint, type-check, build, and push TL-Dashboard Docker image to DockerHub
#
# Triggers:
#   - Push to any branch
#   - Push of any version tags (v*.*.*)
#   - Pull requests against main (build only — no push)
#
# Image name is fixed below. (A DOCKER_REPO org variable used to override it —
# a stale one pointing at the old name silently redirected releases, so the
# indirection was removed in v0.6.0. Delete the variable if it still exists.)
#
# Required GitHub organisation secrets (Settings → Secrets → Organisation):
#   DOCKERHUB_USER   — DockerHub username
#   DOCKERHUB_TOKEN  — DockerHub access token (Read, Write, Delete scope)
#                      Create at: https://hub.docker.com/settings/security
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  IMAGE: techlotse/tl-dashboard
  # Opt in to Node.js 24 runtime for all actions (required from June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Quality gates: type-check + build ──────────────────────────────────────
  lint:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install backend deps
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Type-check backend
        run: npx tsc --noEmit
        working-directory: backend

      - name: Install frontend deps
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  # ── Docker build & push ─────────────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Compose syntax validation ───────────────────────────────────────────────
  validate:
    name: Validate Compose
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml syntax
        run: docker compose -f docker-compose.yml config --quiet
