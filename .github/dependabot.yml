# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — automated dependency updates
#
# Covers all four dependency surfaces in this repo:
#   - npm (backend)   — Express API
#   - npm (frontend)  — React/Vite dashboard
#   - docker          — node:22-alpine base images in Dockerfile
#   - github-actions  — action pins in .github/workflows/
#
# Updates are grouped so a week's patches arrive as one PR per ecosystem
# rather than a dozen. Majors are kept separate — they need a human.
# ─────────────────────────────────────────────────────────────────────────────

version: 2

updates:
  # ── Backend (Express API) ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Frontend (React/Vite dashboard) ────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Docker base images ─────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"

  # ── GitHub Actions pins ────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-all:
        patterns:
          - "*"
